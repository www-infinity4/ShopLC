name: ShopLC viewer wallet receipt regression
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'test/shoplc-click-receipt.test.cjs'
      - '.github/workflows/shoplc-wallet-receipts.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'test/shoplc-click-receipt.test.cjs'
      - '.github/workflows/shoplc-wallet-receipts.yml'
jobs:
  verify-click-credit-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --check app.js
      - run: node --test test/shoplc-click-receipt.test.cjs
